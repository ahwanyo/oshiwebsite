<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>推し應援頁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <div class="wrap">
    <p class="eyebrow" id="hero-eyebrow"></p>
    <h1 id="hero-name"></h1>
    <p class="tagline" id="hero-tagline"></p>
  </div>
</header>

<div class="wrap">
  <div class="ticket">
    <div class="ticket-body">
      <dl id="ticket-dl"></dl>
    </div>
    <div class="ticket-stub">推し應援券</div>
  </div>
</div>

<div class="wrap">

  <section class="block">
    <h2>初配信直播存檔</h2>
    <a class="archive-card" id="archive-link" href="#" target="_blank" rel="noopener">
      <span class="archive-play">▶</span>
      <span class="archive-text">
        <span class="archive-title" id="archive-title"></span>
        <span class="archive-sub" id="archive-sub"></span>
      </span>
    </a>
  </section>

  <section class="block">
    <h2>紀錄喜歡的東西</h2>
    <ul class="timeline" id="timeline"></ul>
  </section>

  <section class="block">
    <h2>回憶牆</h2>
    <div class="gallery" id="gallery"></div>
  </section>

  <section class="block">
    <h2>喜歡的一句話</h2>
    <div class="quote-box" id="quote-box">
      <p id="quote-text"></p>
      <span class="hint">點我</span>
    </div>
  </section>

  <section class="block">
    <h2>相關連結</h2>
    <div class="links" id="links"></div>
  </section>

</div>



<script src="script (1).js"></script>

</body>
</html>
